name: Build StrikeChess

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  STOCKFISH_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_19

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: StrikeChess-Windows
            engine-platform: Windows
            engine-asset: stockfish-windows-x86-64-universal
          - os: ubuntu-24.04
            artifact-name: StrikeChess-Linux
            engine-platform: Linux
            engine-asset: stockfish-linux-x86-64-universal
          - os: macos-latest
            artifact-name: StrikeChess-macOS
            engine-platform: Darwin
            engine-asset: stockfish-macos-universal

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Fetch Stockfish engine (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          asset="${{ matrix.engine-asset }}"
          engine_directory="strikechess/assets/engines/stockfish-19/${{ matrix.engine-platform }}"

          curl -sSfL -o engine.tar.gz "$STOCKFISH_URL/$asset.tar.gz"
          tar -xzf engine.tar.gz
          mv "stockfish/$asset" "$engine_directory/stockfish"
          chmod +x "$engine_directory/stockfish"
          rm -rf stockfish engine.tar.gz

      - name: Fetch Stockfish engine (Windows)
        if: runner.os == 'Windows'
        run: |
          $ProgressPreference = "SilentlyContinue"
          $asset = "${{ matrix.engine-asset }}"
          $engineDirectory = "strikechess/assets/engines/stockfish-19/Windows"

          Invoke-WebRequest -Uri "$env:STOCKFISH_URL/$asset.zip" -OutFile engine.zip
          Expand-Archive engine.zip -DestinationPath . -Force
          Move-Item "stockfish/$asset.exe" "$engineDirectory/stockfish.exe" -Force
          Remove-Item stockfish, engine.zip -Recurse -Force

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libdbus-1-3 \
            libegl1 \
            libpulse0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxkbcommon0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.15'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --clean bundle.spec

      - name: Copy license files (Windows/Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: cp GPL-3.0.txt NOTICE.txt dist/

      - name: Copy Linux files
        if: runner.os == 'Linux'
        run: |
          cp strikechess/assets/icons/logo.svg dist/
          cp strikechess/assets/Linux/install.sh dist/
          cp strikechess/assets/Linux/uninstall.sh dist/

      - name: Compress artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact-name }}.zip .

      - name: Compress artifact (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/StrikeChess.app ${{ matrix.artifact-name }}.zip

      - name: Compress artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path * -DestinationPath ..\${{ matrix.artifact-name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.zip
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
