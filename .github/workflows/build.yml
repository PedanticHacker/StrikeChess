name: Build StrikeChess

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  STOCKFISH_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_18

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: StrikeChess-Windows
            engine-platform: Windows
            engine-slug: windows
          - os: ubuntu-latest
            artifact-name: StrikeChess-Linux
            engine-platform: Linux
            engine-slug: ubuntu
          - os: macos-latest
            artifact-name: StrikeChess-macOS
            engine-platform: Darwin
            engine-slug: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Fetch Stockfish engines (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          engine_directory="strikechess/assets/engines/stockfish-18/${{ matrix.engine-platform }}"

          for variant_directory in "$engine_directory"/*; do
            variant=$(basename "$variant_directory")

            if [ "$variant" = "apple-silicon" ]; then
              asset="stockfish-macos-m1-apple-silicon"
            elif [ "$variant" = "x86-64" ]; then
              asset="stockfish-${{ matrix.engine-slug }}-x86-64"
            else
              asset="stockfish-${{ matrix.engine-slug }}-x86-64-$variant"
            fi

            curl -sSfL -o engine.tar "$STOCKFISH_URL/$asset.tar"
            tar -xf engine.tar
            mv "stockfish/$asset" "$variant_directory/stockfish"
            chmod +x "$variant_directory/stockfish"
            rm -rf stockfish engine.tar
          done

      - name: Fetch Stockfish engines (Windows)
        if: runner.os == 'Windows'
        run: |
          $ProgressPreference = "SilentlyContinue"
          $engineDirectory = "strikechess/assets/engines/stockfish-18/Windows"

          foreach ($variantDirectory in Get-ChildItem $engineDirectory -Directory) {
            $variant = $variantDirectory.Name

            if ($variant -eq "x86-64") {
              $asset = "stockfish-windows-x86-64"
            } else {
              $asset = "stockfish-windows-x86-64-$variant"
            }

            Invoke-WebRequest -Uri "$env:STOCKFISH_URL/$asset.zip" -OutFile engine.zip
            Expand-Archive engine.zip -DestinationPath . -Force
            Move-Item "stockfish/$asset.exe" "$($variantDirectory.FullName)/stockfish.exe" -Force
            Remove-Item stockfish, engine.zip -Recurse -Force
          }

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libdbus-1-3 \
            libegl1 \
            libpulse0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxkbcommon0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --clean bundle.spec

      - name: Copy Linux files
        if: runner.os == 'Linux'
        run: |
          cp strikechess/assets/icons/logo.svg dist/
          cp strikechess/assets/Linux/install.sh dist/
          cp strikechess/assets/Linux/uninstall.sh dist/

      - name: Compress artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact-name }}.zip .

      - name: Compress artifact (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/StrikeChess.app ${{ matrix.artifact-name }}.zip

      - name: Compress artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path * -DestinationPath ..\${{ matrix.artifact-name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.zip
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
